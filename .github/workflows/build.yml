name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: polling
          MYSQL_USER: kairow
          MYSQL_PASSWORD: kairow
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=5s --health-timeout=5s --health-retries=30
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: polling
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: psql postgresql://postgres:postgres@localhost/polling -v ON_ERROR_STOP=1 -f src/main/resources/io/pollinglib/schema.sql
      - name: Permit trigger migrations in the disposable MySQL test database
        run: docker exec "${{ job.services.mysql.id }}" mysql -uroot -ptest -e 'SET GLOBAL log_bin_trust_function_creators = ON'
      - run: mysql -h 127.0.0.1 -ukairow -pkairow polling < src/main/resources/io/pollinglib/mysql.sql
      - run: mvn -B verify
        env:
          KAIROW_MYSQL_TEST: 'true'
